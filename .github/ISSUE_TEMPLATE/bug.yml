name: Bug
description: Something does not work as it should
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: "1. Run `cwtool listen --file ...`\n2. ..."
  - type: input
    id: version
    attributes:
      label: Version and system
      placeholder: "cwtool 0.1.0, macOS 15.2, M2"
